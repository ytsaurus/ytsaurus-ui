name: "[ci]: Statoscope"

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Statoscope ${{ matrix.revision }} build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        revision: [base, current]
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Prepare base revision
        if: matrix.revision == 'base'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          cp packages/ui/Dockerfile "$RUNNER_TEMP/statoscope.Dockerfile"
          cp packages/ui/.dockerignore "$RUNNER_TEMP/statoscope.dockerignore"
          git reset --hard "$BASE_SHA"
          cp "$RUNNER_TEMP/statoscope.Dockerfile" packages/ui/Dockerfile
          cp "$RUNNER_TEMP/statoscope.dockerignore" packages/ui/.dockerignore
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: matrix.revision == 'base'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build stats
        uses: docker/build-push-action@v7
        with:
          context: packages/ui
          target: statoscope-output
          build-args: ANALYZE_BUNDLE=statoscope
          outputs: type=local,dest=statoscope-${{ matrix.revision }}
          cache-from: |
            type=registry,ref=ghcr.io/ytsaurus/ui-nightly:buildcache-main
            type=registry,ref=ghcr.io/ytsaurus/ui-nightly:buildcache-statoscope-base
            ${{ matrix.revision == 'current' && 'type=gha,scope=statoscope-current' || '' }}
          cache-to: ${{ matrix.revision == 'base' && 'type=registry,ref=ghcr.io/ytsaurus/ui-nightly:buildcache-statoscope-base,mode=max' || 'type=gha,scope=statoscope-current,mode=max' }}
      - name: Upload stats
        uses: actions/upload-artifact@v4
        with:
          name: statoscope-${{ matrix.revision }}
          path: statoscope-${{ matrix.revision }}/stats.json
          if-no-files-found: error
          retention-days: 7

  verify_files:
    name: Statoscope validate
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
      - name: Install Packages
        run: npm ci
      - name: Download base stats
        uses: actions/download-artifact@v4
        with:
          name: statoscope-base
          path: statoscope-base
      - name: Download current stats
        uses: actions/download-artifact@v4
        with:
          name: statoscope-current
          path: statoscope-current
      - name: Validate
        working-directory: packages/ui
        run: npx --no-install statoscope validate -i ../../statoscope-current/stats.json -r ../../statoscope-base/stats.json
      - name: Upload statoscope results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report
          path: packages/ui/report.html
          retention-days: 7
  publish-and-comment:
    name: Publish results and create comment
    needs:
      - verify_files
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: report
          path: ./report.html
      - name: Install AWS CLI
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: 2.22.35
          arch: amd64
      - name: Upload to S3 and Prepare comment
        id: upload_and_prepare
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.UI_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.UI_S3_SECRET_KEY }}
        run: |
          aws s3 cp ./report.html s3://statoscope-reports/${{ github.event.pull_request.number }} --endpoint-url=https://ytsaurus-ui-test-results.s3-private.mds.yandex.net --recursive
          message="${message}[Statoscope report](https://ytsaurus-ui-test-results.s3-website.mds.yandex.net/statoscope-reports/${{ github.event.pull_request.number }}/report.html) is ready.\n"

          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo -e "$message" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        shell: bash
      - name: Create Comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          header: Statoscope
          message: ${{ steps.upload_and_prepare.outputs.message }}
